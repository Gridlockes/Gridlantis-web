<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">A nine-second looping marketing animation at 1920 by 1080 with a headline, three KPI cards, a bar chart, a line chart, a donut chart, and a right-aligned brand wordmark.</h2>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600;700&display=swap');
</style>
<div style="padding:1rem 0">
<div style="width:100%;max-width:1200px;margin:0 auto;background:#0B1026;border-radius:12px;overflow:hidden">
<canvas id="gwCv" width="1920" height="1080" style="width:100%;height:auto;display:block"></canvas>
</div>
<div style="display:flex;gap:10px;margin-top:12px;align-items:center;flex-wrap:wrap">
<button id="gwPlay" style="width:auto">Pause</button>
<input type="range" id="gwScrub" min="0" max="900" step="1" value="0" style="flex:1;min-width:200px" />
<span id="gwT" style="font-size:13px;color:var(--text-secondary);font-variant-numeric:tabular-nums">0.00s</span>
</div>
<p style="font-size:12px;color:var(--text-secondary);margin:6px 0 0">Preview controls sit outside the canvas and are excluded from the export.</p>
</div>
<script>
(function(){
const cv=document.getElementById('gwCv'),ctx=cv.getContext('2d'),W=1920,H=1080,DUR=9;
/* ---- BRAND BLOCK — swap these to rebrand ---- */
const BRAND={name:'GRIDLANTIS',accent:'#4DD0E1',accent2:'#FFD93D',pos:'#5DE8C0',
 bg:'#0B1026',panel:'#16244E',border:'#2A4079',grid:'#243A73',
 text:'#93A9D6',bright:'#EAF1FF',display:'Orbitron',body:'Rajdhani'};
const B=BRAND,COR='#FF7A6B',PUR='#C084FC';
const FD=(w,s)=>`${w} ${s}px ${B.display},system-ui,sans-serif`;
const FB=(w,s)=>`${w} ${s}px ${B.body},system-ui,sans-serif`;
function mulb(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rn=mulb(41),dots=[];
for(let i=0;i<90;i++)dots.push({x:rn()*W,y:rn()*H,r:rn()*3+1,s:rn()*14+4,a:rn()*.3+.08});
const BARS=[52,61,58,74,83,96],QL=['Q1','Q2','Q3','Q4','Q5','Q6'];
const SEG=[{l:'Direct',c:B.accent,v:38},{l:'Partner',c:B.accent2,v:27},{l:'Online',c:COR,v:21},{l:'Other',c:PUR,v:14}];
const KPI=[{l:'REVENUE MTD',v:184300,f:n=>'$'+Math.round(n).toLocaleString(),d:'+18.4%'},
 {l:'ACTIVE ACCOUNTS',v:412,f:n=>Math.round(n).toLocaleString(),d:'+7.2%'},
 {l:'GROSS MARGIN',v:62.4,f:n=>n.toFixed(1)+'%',d:'+3.1 pts'}];
const LN=[],CS=[];{let a=44,b=31;const r2=mulb(9);
 for(let i=0;i<64;i++){a+=(r2()-.35)*3.1;b+=(r2()-.5)*2.0;LN.push(a);CS.push(Math.max(12,b));}}
const cl=(x,a,b)=>x<a?a:x>b?b:x, sg=(t,s,d)=>cl((t-s)/d,0,1),
 eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function panel(x,y,w,h,p,title,out){
 const o=(1-eo(p))*50;ctx.globalAlpha=p*out;
 ctx.fillStyle=B.panel;rr(x,y+o,w,h,18);ctx.fill();
 ctx.strokeStyle=B.border;ctx.lineWidth=2;rr(x,y+o,w,h,18);ctx.stroke();
 if(title){ctx.fillStyle=B.text;ctx.font=FB(600,22);ctx.textAlign='left';ctx.fillText(title,x+34,y+o+50);}
 ctx.globalAlpha=1;return o;}
function render(t){
 t=((t%DUR)+DUR)%DUR;
 const out=1-eo(sg(t,7.6,1.4));
 ctx.fillStyle=B.bg;ctx.fillRect(0,0,W,H);
 const gp=eo(sg(t,0,.7));
 ctx.strokeStyle='#16255280';ctx.lineWidth=1;
 for(let x=0;x<=W;x+=80){ctx.globalAlpha=gp*out*.5;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H*gp);ctx.stroke();}
 for(let y=0;y<=H;y+=80){ctx.globalAlpha=gp*out*.5;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W*gp,y);ctx.stroke();}
 dots.forEach(d=>{const x=(d.x+t*d.s)%W;ctx.globalAlpha=d.a*gp*out;ctx.fillStyle='#3C5A9A';
  ctx.beginPath();ctx.arc(x,d.y,d.r,0,6.3);ctx.fill();});
 ctx.globalAlpha=1;
 const hp=eo(sg(t,.25,.85)),ho=(1-hp)*36;
 ctx.globalAlpha=hp*out;ctx.textAlign='left';
 ctx.fillStyle=B.bright;ctx.font=FD(700,64);ctx.fillText('Q3 PERFORMANCE',100,148+ho);
 ctx.fillStyle=B.text;ctx.font=FB(500,32);
 ctx.fillText('Every metric that matters, in one view',100,200+ho);
 ctx.fillStyle=B.accent;rr(100,224+ho,132,6,3);ctx.fill();
 ctx.globalAlpha=1;
 KPI.forEach((k,i)=>{
  const p=eo(sg(t,.9+i*.15,.75)),x=100+i*590,y=290,w=540,h=190,o=(1-p)*46;
  ctx.globalAlpha=p*out;
  ctx.fillStyle=B.panel;rr(x,y+o,w,h,18);ctx.fill();
  ctx.strokeStyle=B.border;ctx.lineWidth=2;rr(x,y+o,w,h,18);ctx.stroke();
  ctx.fillStyle=[B.accent,B.accent2,B.pos][i];rr(x,y+o,7,h,4);ctx.fill();
  ctx.fillStyle=B.text;ctx.font=FB(600,21);ctx.textAlign='left';ctx.fillText(k.l,x+38,y+o+52);
  const cp=eio(sg(t,1.05+i*.15,1.25));
  ctx.fillStyle=B.bright;ctx.font=FB(700,60);ctx.fillText(k.f(k.v*cp),x+38,y+o+128);
  const bp=eo(sg(t,1.95+i*.12,.5));ctx.globalAlpha=p*bp*out;
  ctx.fillStyle='#12463C';rr(x+38,y+o+150,146,36,18);ctx.fill();
  ctx.fillStyle=B.pos;ctx.font=FB(600,21);ctx.fillText('▲ '+k.d,x+56,y+o+175);
  ctx.globalAlpha=1;});
 const py=530,ph=430;
 const p1=eo(sg(t,1.9,.7)),o1=panel(100,py,660,ph,p1,'REVENUE BY QUARTER',out);
 if(p1>0){const base=py+o1+360,top=py+o1+112,bx=160,bw=72,gpx=28;
  ctx.strokeStyle=B.grid;ctx.lineWidth=1;ctx.globalAlpha=p1*out*.9;
  for(let i=0;i<=3;i++){const y=base-(base-top)*i/3;ctx.beginPath();ctx.moveTo(140,y);ctx.lineTo(720,y);ctx.stroke();}
  BARS.forEach((v,i)=>{const g=eo(sg(t,2.15+i*.08,.55)),x=bx+i*(bw+gpx),h=(base-top)*(v/100)*g;
   ctx.globalAlpha=p1*out;ctx.fillStyle=i===5?B.accent:'#31699C';rr(x,base-h,bw,h,7);ctx.fill();
   ctx.globalAlpha=g*out;ctx.fillStyle=B.text;ctx.font=FB(500,21);ctx.textAlign='center';
   ctx.fillText(QL[i],x+bw/2,base+36);
   ctx.fillStyle='#CBDCFF';ctx.font=FB(600,22);ctx.fillText(Math.round(v*g),x+bw/2,base-h-14);});
  ctx.globalAlpha=1;}
 const p2=eo(sg(t,2.2,.7)),o2=panel(800,py,620,ph,p2,'REVENUE VS COST',out);
 if(p2>0){const lx=846,lw=530,ly=py+o2+112,lh=236,
   all=LN.concat(CS),mn=Math.min(...all),mx=Math.max(...all),
   rp=eio(sg(t,2.5,1.7)),N=Math.max(2,Math.floor(LN.length*rp));
  ctx.strokeStyle=B.grid;ctx.lineWidth=1;ctx.globalAlpha=p2*out*.85;
  for(let i=0;i<=3;i++){const y=ly+lh*i/3;ctx.beginPath();ctx.moveTo(lx,y);ctx.lineTo(lx+lw,y);ctx.stroke();}
  const PX=j=>lx+lw*j/(LN.length-1),PY=v=>ly+lh-(v-mn)/((mx-mn)||1)*lh;
  ctx.globalAlpha=p2*out*.17;ctx.fillStyle=B.accent;
  ctx.beginPath();ctx.moveTo(PX(0),ly+lh);
  for(let j=0;j<N;j++)ctx.lineTo(PX(j),PY(LN[j]));
  ctx.lineTo(PX(N-1),ly+lh);ctx.closePath();ctx.fill();
  ctx.globalAlpha=p2*out;
  ctx.beginPath();for(let j=0;j<N;j++)j?ctx.lineTo(PX(j),PY(LN[j])):ctx.moveTo(PX(j),PY(LN[j]));
  ctx.strokeStyle=B.accent;ctx.lineWidth=4;ctx.lineJoin='round';ctx.stroke();
  ctx.beginPath();for(let j=0;j<N;j++)j?ctx.lineTo(PX(j),PY(CS[j])):ctx.moveTo(PX(j),PY(CS[j]));
  ctx.strokeStyle=COR;ctx.lineWidth=3;ctx.setLineDash([9,9]);ctx.stroke();ctx.setLineDash([]);
  const ex=PX(N-1),ey=PY(LN[N-1]),pu=1+Math.sin(t*3.3)*.12;
  ctx.fillStyle=B.bg;ctx.beginPath();ctx.arc(ex,ey,11*pu,0,6.3);ctx.fill();
  ctx.strokeStyle=B.accent;ctx.lineWidth=4;ctx.beginPath();ctx.arc(ex,ey,9*pu,0,6.3);ctx.stroke();
  ctx.textAlign='left';ctx.font=FB(500,21);
  ctx.fillStyle=B.accent;ctx.fillRect(lx,ly+lh+54,24,5);ctx.fillText('Revenue',lx+36,ly+lh+62);
  ctx.fillStyle=COR;ctx.fillRect(lx+184,ly+lh+54,24,5);ctx.fillText('Cost',lx+220,ly+lh+62);
  ctx.globalAlpha=1;}
 const p3=eo(sg(t,2.5,.7)),o3=panel(1460,py,360,ph,p3,'BY CHANNEL',out);
 if(p3>0){
  const cx=1640,cy=py+o3+195,ro=95,ri=60,sw=eio(sg(t,2.9,1.2));
  let a0=-Math.PI/2;ctx.globalAlpha=p3*out;
  SEG.forEach(g=>{const a=g.v/100*6.2832*sw;
   ctx.beginPath();ctx.arc(cx,cy,ro,a0,a0+a);ctx.arc(cx,cy,ri,a0+a,a0,true);ctx.closePath();
   ctx.fillStyle=g.c;ctx.fill();ctx.strokeStyle=B.panel;ctx.lineWidth=5;ctx.stroke();a0+=a;});
  const lp=eo(sg(t,3.8,.6));ctx.globalAlpha=p3*out*lp;
  ctx.textAlign='center';ctx.fillStyle=B.bright;ctx.font=FB(700,44);ctx.fillText('38%',cx,cy+8);
  ctx.fillStyle=B.text;ctx.font=FB(600,19);ctx.fillText('DIRECT',cx,cy+38);
  ctx.textAlign='left';
  SEG.forEach((g,i)=>{
   const y=py+o3+310+i*32,q=eo(sg(t,3.85+i*.09,.45));
   ctx.globalAlpha=p3*out*q;
   ctx.fillStyle=g.c;rr(1500,y-14,15,15,4);ctx.fill();
   ctx.fillStyle='#CBDCFF';ctx.font=FB(500,22);ctx.fillText(g.l,1526,y);
   ctx.textAlign='right';ctx.fillStyle=B.text;ctx.fillText(g.v+'%',1786,y);ctx.textAlign='left';});
  ctx.globalAlpha=1;}
 const fp=eo(sg(t,4.3,.7));ctx.globalAlpha=fp*out;
 ctx.textAlign='left';ctx.fillStyle=B.text;ctx.font=FB(500,28);
 ctx.fillText('One dashboard. Every signal. Zero guesswork.',100,1022);
 ctx.globalAlpha=1;
 const wp=eo(sg(t,4.55,.7));
 ctx.globalAlpha=wp*out;ctx.textAlign='right';ctx.fillStyle=B.bright;
 ctx.font=FD(500,32);ctx.fillText(B.name,1820,1022);
 ctx.textAlign='left';ctx.globalAlpha=1;
}
window.LOOP_MS=DUR*1000;
window.renderFrame=ms=>render(ms/1000);
let playing=true,base=performance.now(),man=0;
const sc=document.getElementById('gwScrub'),lb=document.getElementById('gwT'),pl=document.getElementById('gwPlay');
function loop(now){
 const t=playing?((now-base)/1000)%DUR:man;
 if(playing)sc.value=Math.round(t*100);
 render(t);lb.textContent=t.toFixed(2)+'s';requestAnimationFrame(loop);}
requestAnimationFrame(loop);
pl.onclick=()=>{playing=!playing;pl.textContent=playing?'Pause':'Play';
 if(playing)base=performance.now()-man*1000;};
sc.oninput=e=>{playing=false;pl.textContent='Play';man=e.target.value/100;};
})();
</script>
